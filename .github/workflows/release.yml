name: Release

# Fires on a pushed version tag (e.g. v1.0.0). Checks out this repo alongside its two
# sibling app repos (same layout scripts/build-package.ps1 expects locally), builds all
# four platform packages on a single Linux runner (dotnet publish cross-compiles, no
# need for separate macOS/Windows runners), and publishes them as a GitHub release with
# a formatted body instead of the default auto-generated notes.
on:
  push:
    tags:
      - "v*.*.*"

# Deleting and re-pushing the same tag (e.g. to fix a typo before a proper version bump)
# fires a second run against the same ref while an earlier run for that same tag might
# still be building - without this, both runs eventually publish to the same release and
# whichever one's publish step lands last wins, silently discarding the other's output.
# Keying on github.ref (not run id) and cancelling in-progress makes a newer push for the
# same tag supersede an older one instead of racing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4
        with:
          path: Log-Analyser
          fetch-depth: 0 # full history, so git log/describe below can find the previous tag

      # LogAnalyser and LogAnalyser-WebApp are private repos - the default GITHUB_TOKEN
      # only has access to the repo a workflow runs in, so checking out a sibling
      # private repo needs a PAT with read access to both, stored as REPO_ACCESS_TOKEN
      # (Settings -> Secrets and variables -> Actions on this repo).
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: Zarin85/LogAnalyser
          path: LogAnalyser
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: Zarin85/LogAnalyser-WebApp
          path: LogAnalyser-WebApp
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: LogAnalyser-WebApp/package-lock.json

      - name: Install frontend dependencies
        working-directory: LogAnalyser-WebApp
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build release packages
        shell: pwsh
        working-directory: Log-Analyser
        run: ./scripts/build-package.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Generate release notes
        id: notes
        working-directory: Log-Analyser
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${GITHUB_SHA:0:7}"
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"

          {
            echo "_Automated build for commit \`$SHA\`._"
            echo ""
            echo "### 🔎 What is Log Analyser?"
            echo ""
            echo "> **Turn a flood of log lines into a handful of problems you can actually act on.**"
            echo ""
            echo "| 😵 Without Log Analyser | ✅ With Log Analyser |"
            echo "|---|---|"
            echo "| 90 near-identical error lines, one per trace ID | **1** tracked problem, occurring 90 times |"
            echo "| No idea what's new vs. old, known noise | Automatic **New → Spiking → Known → Resolved** lifecycle |"
            echo "| Grepping raw text for the file/line that threw | Class, method, and file:line resolved automatically |"
            echo "| No visibility into slow endpoints | Per-endpoint avg / min / max response time, same log files |"
            echo ""
            echo "🔒 **Self-hosted** — your logs never leave your machine or network"
            echo ""
            echo "🔌 **Zero integration work** — reads the log files you already have, no agents or code changes"
            echo ""
            echo "⚙️ **ASP.NET Core 8 · Angular 18 · SQLite** — packaged as one self-contained folder per OS, nothing else to install"
            echo ""
            echo "### 🚀 Getting started"
            echo ""
            echo "1. Download the zip for your platform below and extract it anywhere"
            echo "2. Run \`run.bat\` (Windows) or \`./run.sh\` (macOS/Linux) — this starts the API"
            echo "   and the log collector in the background (no console windows on Windows)"
            echo "   and opens your browser to \`http://localhost:5171\`. On Windows, stop"
            echo "   LogAnalyser later with \`stop.bat\`; on macOS/Linux, Ctrl+C in the terminal"
            echo "3. Sign up with a name, email, and password (accounts are stored locally —"
            echo "   nothing goes to an external identity provider)"
            echo "4. Create a **project** (name it, and list the service subfolders your logs"
            echo "   are organised into)"
            echo "5. Add an **environment** under it (a name, and the log folder path you have"
            echo "   access to) — the collector reaches it and starts tracking within minutes"
            echo ""
            echo "From there it runs itself: the collector re-checks every environment on a"
            echo "timer, picking up new log lines and any environment added or changed through"
            echo "the web app automatically — no restart needed. Your data (\`config.json\`,"
            echo "\`app.db\`, \`environments/\`) lives next to the executables; updating to a newer"
            echo "release only means replacing the \`api/\` and \`collector/\` folders."
            echo ""
            echo "### 🔒 Security & privacy"
            echo ""
            echo "Log content is treated as sensitive by default: email addresses, JWTs, and"
            echo "anything behind a label like \`password\`/\`secret\`/\`token\` are redacted before"
            echo "the API ever serves them to the dashboard. Everything runs on your own machine"
            echo "or network — no telemetry, no external calls beyond what your browser makes to"
            echo "your own \`localhost:5171\`."
            echo ""
            echo "### 📦 Downloads"
            echo ""
            REL="https://github.com/${{ github.repository }}/releases/download/$TAG"
            echo "| Platform | Package | Notes |"
            echo "|---|---|---|"
            echo "| 🪟 Windows (x64) | [LogAnalyser-$VERSION-win-x64.zip]($REL/LogAnalyser-$VERSION-win-x64.zip) | double-click \`run.bat\` |"
            echo "| 🍎 macOS (Intel) | [LogAnalyser-$VERSION-osx-x64.zip]($REL/LogAnalyser-$VERSION-osx-x64.zip) | \`chmod +x run.sh && ./run.sh\` |"
            echo "| 🍎 macOS (Apple Silicon) | [LogAnalyser-$VERSION-osx-arm64.zip]($REL/LogAnalyser-$VERSION-osx-arm64.zip) | same as above |"
            echo "| 🐧 Linux (x64) | [LogAnalyser-$VERSION-linux-x64.zip]($REL/LogAnalyser-$VERSION-linux-x64.zip) | same as above |"
            echo ""
            echo "Each package is fully self-contained — no separate .NET, Node, or database"
            echo "install required on the machine running it."
            echo ""
            echo "### ✨ Core highlights"
            echo ""
            echo "- **Automatic error grouping** — normalises and signature-hashes log lines so recurring errors collapse into one tracked problem instead of hundreds of near-duplicates"
            echo "- **Cross-service detection** — a signature appearing in more than one service is flagged systemic and ranked Critical severity automatically"
            echo "- **Status lifecycle** — New / Spiking / Known / Suppressed / Resolved, recomputed automatically every collection run, with a full occurrence history chart per problem"
            echo "- **Endpoint performance stats** — avg/min/max response time per endpoint, mined from the same request-timing log lines, no extra instrumentation"
            echo "- **Redaction built-in** — emails, JWTs, and labelled secrets are scrubbed before anything is served or displayed, anywhere in the pipeline"
            echo "- **Hard environment isolation** — each environment's data lives in its own SQLite file, so nothing can leak across projects or environments even by accident"
            echo "- **Origin resolution** — pinpoints each problem's class, method, and file:line straight from the stack trace text, no local checkout needed to see where it happened"
            echo "- **Trace ID surfacing** — pulls the request trace ID back out for any problem that has one, ready to correlate with your other tooling"
            echo "- **Instant re-check on change** — adding or editing an environment's log path triggers a collection run immediately in the background, not on the next scheduled cycle"
            echo "- **Searchable dashboard** — filter the problem table by message, service, or class straight from the toolbar, and re-sort by severity, count, or recency"
            echo ""
            echo "### 📝 Recent commits"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h) by %an"
            else
              git log --pretty=format:"- %s (%h) by %an" -n 10
            fi
            echo ""
          } > RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "🔍 Log Analyser ${{ steps.version.outputs.tag }}"
          body_path: Log-Analyser/RELEASE_NOTES.md
          files: Log-Analyser/release/*.zip
